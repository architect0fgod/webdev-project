<!DOCTYPE html>
<html>

<head>
    <title>WEB DEV PROJECT - SCHOLAR DIARY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">

        <button type="button" id="hamburger" class="hamburger">
            ≡
        </button>
        <ul id="navMenu" class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="calendar.html">Calendar</a></li>
            <li><a href="diary.html">Diary</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>

        <div class="nav-name">
            <a href="index.html">Pippo The Diary</a>
        </div>

        <div class="nav-team">
            <a href="about.html">DocktypeHtml</a>

        </div>
    </header>
    <div class="container">
        <div class="left">
            <!-- Pomodoro timer -->
            <div class="timer">
                <h1 id="label">Work</h1>
                <div id="time">25:00</div>
                <button id="start">Start</button>
                <button id="pause">Pause</button>
                <button id="reset">Reset</button>
            </div>
            <audio id="bell_ring">
                <source src="media/bell_ring.mp3" type="audio/mpeg">
            </audio>
            <div class="bar">
                <input type="number" id="work_time_setter" value="25">
                <input type="number" id="break_time_setter" value="5">
                <button id="set_new_time">Set time</button>
            </div>

        </div>
        <div class="lofi-player">

            <h3>♫ Lo-fi Corner</h3>

            <img src="media/lofi.jpg" alt="Lo-fi room">

            <h2>Late Night Vibes</h2>
            <p>Lo-fi · Chill Beats</p>

            <audio id="lofiAudio" loop>
                <source src="media/lofi.mp3" type="audio/mpeg">
            </audio>

            <button id="playBtn" onclick="toggleMusic()">
                ▶
            </button>

            <p class="repeat-text">↻ Repeat enabled</p>

        </div>

    </div>
    <script src="script.js"></script>
    <script src="pomodoro.js"></script>
</body>
</html>
